[package]
name = "that-sky-ahook"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
color-hook = { git = "https://github.com/flakes-ink/color-hook" }
libc = "0.2"

# mlua's `lua52` feature without `vendored` links the exact Lua
# library pointed at by LUA_LIB / LUA_LIB_NAME / LUA_LINK (see flake.nix),
# which is how we get the game's exact Lua 5.2.0 instead of 5.2.4.
mlua = { version = "0.12", features = ["lua52"] }

# Override release profile to not strip and to export init_hook
[profile.release]
strip = "none"
lto = true
panic = "abort"
